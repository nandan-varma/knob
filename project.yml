name: Knob
options:
  bundleIdPrefix: com.nandanvarma.knob
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "72CW7UW6RB"
    GENERATE_INFOPLIST_FILE: NO
configs:
  Debug: debug
  Release: release
targets:
  Knob:
    type: application
    platform: macOS
    sources:
      - path: Knob
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nandanvarma.knob
        PRODUCT_NAME: Knob
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: Knob/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "Copyright (c) 2026."
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSNetworkVolumesUsageDescription: "Knob uses a system content filter to block distracting websites."
    entitlements:
      path: Knob/Knob.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.nandanvarma.knob
        # TEMPORARY: networkextension + system-extension.install removed until Apple approves
        # content-filter-provider-systemextension for Team 72CW7UW6RB (support request filed).
        # App blocking (AppBlocker.swift) needs neither and works fine without them.
    dependencies:
      - target: KnobFilterExtension
        embed: true
  KnobFilterExtension:
    type: com.apple.product-type.system-extension
    platform: macOS
    sources:
      - path: KnobFilterExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nandanvarma.knob.filter
        PRODUCT_NAME: KnobFilterExtension
        SKIP_INSTALL: YES
    info:
      path: KnobFilterExtension/Info.plist
      properties:
        NetworkExtension:
          NEProviderClasses:
            com.apple.networkextension.filter-data: $(PRODUCT_MODULE_NAME).FilterDataProvider
    entitlements:
      path: KnobFilterExtension/KnobFilterExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.nandanvarma.knob
        # TEMPORARY: see Knob.entitlements comment above.
